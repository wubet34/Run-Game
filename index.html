<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temple Dash - Endless Runner</title>
  <meta name="theme-color" content="#ff8c00" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TempleDash" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- START SCREEN -->
  <div id="start-screen" class="screen active">
    <div class="screen-content">
      <h1 class="game-title">TEMPLE<span>DASH</span></h1>
      <p class="subtitle">Run. Dodge. Survive.</p>
      <button id="play-btn" class="btn-primary">▶ PLAY</button>
      <div class="controls-hint">
        <span>← → Move</span>
        <span>Space Jump</span>
        <span>↓ Slide</span>
        <span>Shift Boost</span>
      </div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="hud-item">🏃 <span id="distance-val">0</span>m</div>
      <div class="hud-item">🪙 <span id="coin-val">0</span></div>
      <!-- Magnet active bar -->
      <div id="magnet-bar" class="hud-item magnet-bar">
        🧲 <div id="magnet-icon"></div>
      </div>
    </div>
    <div class="hud-center">
      <div id="score-display"><span id="score-val">0</span></div>
    </div>
    <div class="hud-right">
      <button id="pause-btn" class="btn-icon">⏸</button>
      <button id="sound-btn" class="btn-icon">🔊</button>
    </div>

    <!-- BOOST BUTTON — shown when enemy is close -->
    <div id="boost-wrap">
      <button id="boost-btn" disabled>
        <span id="boost-icon">⚡</span>
        <span id="boost-label">BOOST</span>
        <svg id="boost-ring" viewBox="0 0 44 44">
          <circle cx="22" cy="22" r="19" />
        </svg>
      </button>
      <div id="boost-hint">Shift / B</div>
    </div>
  </div>

  <!-- PAUSE SCREEN -->
  <div id="pause-screen" class="screen hidden">
    <div class="screen-content">
      <h2>PAUSED</h2>
      <button id="resume-btn" class="btn-primary">▶ RESUME</button>
      <button id="restart-btn-pause" class="btn-secondary">↺ RESTART</button>
    </div>
  </div>

  <!-- GAME OVER SCREEN -->
  <div id="gameover-screen" class="screen hidden">
    <div class="screen-content">
      <h2 class="gameover-title">GAME OVER</h2>
      <div class="stats">
        <div class="stat-row"><span>Score</span><span id="final-score">0</span></div>
        <div class="stat-row"><span>Distance</span><span id="final-distance">0m</span></div>
        <div class="stat-row"><span>Coins</span><span id="final-coins">0</span></div>
        <div class="stat-row highlight"><span>Best</span><span id="high-score">0</span></div>
      </div>
      <button id="restart-btn" class="btn-primary">↺ PLAY AGAIN</button>
    </div>
  </div>

  <!-- CANVAS -->
  <canvas id="game-canvas"></canvas>

  <!-- Boost screen flash -->
  <div id="boost-flash"></div>

  <!-- Scripts -->
  <script type="module" src="main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
